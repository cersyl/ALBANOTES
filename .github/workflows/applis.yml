# Compile l'appli Android (APK) et l'appli Windows (.exe) puis les publie dans « Releases ».
# Se déclenche à chaque changement du fichier VERSION sur main, ou à la main (onglet Actions).
name: Applis Android et Windows

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applis
  cancel-in-progress: true

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "ALBANOTES-$(cat VERSION | tr -d '[:space:]').apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ALBANOTES-*.apk
          if-no-files-found: error

  windows:
    name: Appli Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compiler l'appli Windows
        working-directory: desktop
        shell: bash
        run: |
          npm version "$(cat ../VERSION | tr -d '[:space:]')" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  publier:
    name: Publier
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sorties
          merge-multiple: true
      - name: Créer ou mettre à jour la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          cat > notes.md <<NOTES
          ## Installer ALBANOTES $V

          **Android** : téléchargez \`ALBANOTES-$V.apk\` sur le téléphone, ouvrez-le et autorisez l'installation depuis cette source.
          Les mises à jour suivantes s'installent par-dessus, sans perdre les notes.

          **Windows** : \`ALBANOTES-Setup-$V.exe\` (installation, raccourcis Bureau et menu Démarrer)
          ou \`ALBANOTES-Portable-$V.exe\` (sans installation). Si Windows affiche « Windows a protégé votre ordinateur » :
          *Informations complémentaires* → *Exécuter quand même* (l'appli n'est pas signée par un éditeur payant).

          Au premier lancement : adresse du serveur + mot de passe. Ensuite l'appli fonctionne même si le serveur
          est injoignable ; les notes sont envoyées automatiquement dès qu'il répond. L'interface se met à jour
          toute seule depuis le serveur après chaque \`update\`.
          NOTES
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" sorties/* --clobber
          else
            gh release create "v$V" sorties/* --title "ALBANOTES $V" --notes-file notes.md --latest
          fi
